name: cryptopatro

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      CRYPTOPATRO_DATABASE_PATH: /app/data/cryptopatro.sqlite3
      CRYPTOPATRO_CORS_ORIGINS: '["http://localhost:4321", "http://127.0.0.1:4321"]'
      CRYPTOPATRO_TRUST_PROXY_HEADERS: "true"
      CRYPTOPATRO_RATE_LIMIT_MODE: ${CRYPTOPATRO_RATE_LIMIT_MODE:-client_ip}
      CRYPTOPATRO_AI_RUNS_PER_HOUR: ${CRYPTOPATRO_AI_RUNS_PER_HOUR:-120}
      CRYPTOPATRO_AI_RUNS_PER_DAY: ${CRYPTOPATRO_AI_RUNS_PER_DAY:-1000}
      CRYPTOPATRO_AI_MAX_CONCURRENT: ${CRYPTOPATRO_AI_MAX_CONCURRENT:-4}
      CRYPTOPATRO_AI_MODEL: ${CRYPTOPATRO_AI_MODEL:-}
      CRYPTOPATRO_MARKET_ENABLED: ${CRYPTOPATRO_MARKET_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - portfolio-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4321}
      HOST: 0.0.0.0
      PORT: 4321
    ports:
      - "${PORT:-4321}:4321"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

volumes:
  portfolio-data:
