name: Build Release Images

on:
  push:
    branches:
      - codex/cryptopatro-rebuild
    paths:
      - 'backend/cryptopatro/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/.python-version'
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'frontend/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: dorukgezici/cryptopatro
  PUBLIC_SITE_URL: https://cryptopatro.pub.gezici.me

jobs:
  verify:
    name: Verify release prerequisites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.15'
          enable-cache: true
      - name: Verify the backend
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:proxy
          npm run test:postcards
          npm run build

  publish:
    name: Publish ${{ matrix.component }} ARM64 image
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish the commit image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}-${{ matrix.component }}
          build-args: ${{ matrix.component == 'frontend' && format('PUBLIC_SITE_URL={0}', env.PUBLIC_SITE_URL) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=CryptoPatro ${{ matrix.component }}
          cache-from: type=gha,scope=release-${{ matrix.component }}-arm64
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}-arm64
      - name: Record the published image digest
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_TAG: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}-${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ['IMAGE_TAG']
          digest = os.environ['IMAGE_DIGEST']
          if not digest.startswith('sha256:'):
              raise SystemExit('The build did not return a published image digest.')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(
                  f"### {os.environ['COMPONENT']} ARM64 image\n\n"
                  f"Tag: `{tag}`\n\n"
                  f"Digest: `{digest}`\n\n"
                  f"Exact image: `{os.environ['IMAGE_REPOSITORY']}@{digest}`\n\n"
                  "Images published only. This workflow does not deploy or modify the cluster.\n"
              )
          PY
