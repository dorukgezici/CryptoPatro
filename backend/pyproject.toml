[project]
name = "cryptopatro"
version = "2.0.0"
description = "A private crypto portfolio workspace with a grounded AI copilot"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.0",
  "pydantic-ai-slim[openai]==2.55.0",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryptopatro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
