apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cryptopatro.fullname" . }}
  labels:
    {{- include "cryptopatro.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cryptopatro.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4321
