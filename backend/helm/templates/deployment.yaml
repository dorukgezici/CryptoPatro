{{- if not (has .Values.backend.rateLimitMode (list "client_ip" "shared_proxy")) -}}
{{- fail "backend.rateLimitMode must be client_ip or shared_proxy" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryptopatro.fullname" . }}
  labels:
    {{- include "cryptopatro.labels" . | nindent 4 }}
spec:
  # SQLite storage and process-local rate limits require one backend process.
  replicas: 1
  strategy:
    type: Recreate
    # Clear the API-defaulted rollingUpdate block on the existing Deployment.
    rollingUpdate: null
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      {{- include "cryptopatro.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cryptopatro.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cryptopatro.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "cryptopatro.image" .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
            - name: BACKEND_URL
              value: "http://127.0.0.1:8000"
            - name: PUBLIC_SITE_URL
              value: {{ .Values.frontend.publicSiteUrl | quote }}
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
        - name: backend
          image: {{ include "cryptopatro.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: [uvicorn]
          args: ["cryptopatro.main:app", "--host", "127.0.0.1", "--port", "8000", "--workers", "1", "--no-proxy-headers"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: CRYPTOPATRO_DATABASE_PATH
              value: /app/data/cryptopatro.sqlite3
            - name: CRYPTOPATRO_TRUST_PROXY_HEADERS
              value: "true"
            - name: CRYPTOPATRO_RATE_LIMIT_MODE
              value: {{ .Values.backend.rateLimitMode | quote }}
            {{- range $name, $value := .Values.backend.capacity }}
            - name: {{ printf "CRYPTOPATRO_%s" $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            - name: CRYPTOPATRO_CORS_ORIGINS
              value: {{ list .Values.frontend.publicSiteUrl | toJson | quote }}
            - name: CRYPTOPATRO_MARKET_ENABLED
              value: {{ .Values.backend.marketEnabled | quote }}
            {{- if .Values.backend.ai.model }}
            - name: CRYPTOPATRO_AI_MODEL
              value: {{ .Values.backend.ai.model | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "backend.ai.existingSecret is required when an AI model is set" .Values.backend.ai.existingSecret | quote }}
                  key: {{ required "backend.ai.apiKeyKey is required when an AI model is set" .Values.backend.ai.apiKeyKey | quote }}
            {{- end }}
          startupProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName | quote }}
