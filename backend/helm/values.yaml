# Argo CD renders this chart from backend/helm into namespace default.
# Replace both placeholder tags with published immutable release tags before syncing.
backend:
  image:
    repository: dorukgezici/cryptopatro
    tag: v2-backend
    pullPolicy: IfNotPresent
  marketEnabled: true
  ai:
    model: ""
    existingSecret: ""
    apiKeyKey: OPENAI_API_KEY
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

frontend:
  image:
    repository: dorukgezici/cryptopatro
    tag: v2-frontend
    pullPolicy: IfNotPresent
  publicSiteUrl: https://cryptopatro.pub.gezici.me
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

imagePullSecrets: []

persistence:
  claimName: cryptopatro-data
  storageClass: longhorn
  size: 1Gi

# Keep the existing Service port and ingress resource names during the migration.
service:
  port: 8000

ingress:
  className: traefik
  host: cryptopatro.pub.gezici.me
  tlsSecretName: cryptopatro-tls
  clusterIssuer: cloudflare

networkPolicy:
  ingressNamespace: kube-system
  ingressPodLabels:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
