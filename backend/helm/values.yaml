# Argo CD renders this chart from backend/helm into namespace default.
# Release images are pinned by registry digest; tags record the source commit.
backend:
  image:
    repository: dorukgezici/cryptopatro
    tag: 77048531fbdd96400ecf519b6ac3d7f5104dafcb-backend
    digest: sha256:51683b5bd5b264cbb53ac3b9718ebb7cd48e94270cacd121d5e07fe816a6b50a
    pullPolicy: IfNotPresent
  marketEnabled: true
  # The OCI TCP proxy does not preserve visitor addresses. Quotas use verified
  # portfolio identities plus aggregate capacity, without changing shared ingress.
  rateLimitMode: shared_proxy
  capacity:
    SERVICE_SESSIONS_PER_MINUTE: 120
    SERVICE_SESSIONS_PER_HOUR: 2000
    SERVICE_SHARES_PER_MINUTE: 120
    SERVICE_SHARES_PER_HOUR: 1000
    SERVICE_EVENTS_PER_MINUTE: 600
    SERVICE_CHAT_PER_MINUTE: 240
    AI_RUNS_PER_HOUR: 120
    AI_RUNS_PER_DAY: 1000
    AI_MAX_CONCURRENT: 4
  ai:
    model: ""
    existingSecret: ""
    apiKeyKey: OPENAI_API_KEY
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

frontend:
  image:
    repository: dorukgezici/cryptopatro
    tag: 77048531fbdd96400ecf519b6ac3d7f5104dafcb-frontend
    digest: sha256:a79a92456ee4fa8d3efff8c7d015e11963e3d615cf90bb088a553714dd249f32
    pullPolicy: IfNotPresent
  publicSiteUrl: https://cryptopatro.pub.gezici.me
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

imagePullSecrets: []

persistence:
  claimName: cryptopatro-data
  storageClass: longhorn
  size: 1Gi

# Keep the existing Service port and ingress resource names during the migration.
service:
  port: 8000

ingress:
  className: traefik
  host: cryptopatro.pub.gezici.me
  tlsSecretName: cryptopatro-tls
  clusterIssuer: cloudflare

networkPolicy:
  ingressNamespace: kube-system
  ingressPodLabels:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
